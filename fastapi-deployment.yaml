apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  labels:
    app: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: api-server
        image: hfs7/telemetry-api:v1.0
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds:150
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3

        env:
        - name: SECURE_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USER
        - name: SECURE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD
        - name: SECURE_DB
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_NAME
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_PORT
        - name: DATABASE_URL
          value: postgresql+asyncpg://$(SECURE_USER):$(SECURE_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(SECURE_DB)
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
spec:
  selector:
    app: fastapi
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    nodePort: 30080
  type: NodePort
